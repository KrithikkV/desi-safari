<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bihar Tourist Cards</title>

<link rel="stylesheet" href="../../ScrollBar.css">
<link rel="stylesheet" href="../../RightStyle.css">
<link rel="stylesheet" href="../../CardStyle.css">


<style>

/* ⭐ STAR */
.star {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
    color: white;
    transition: 0.3s;
}

.card-back .star {
    color: black;
}

.star.active {
    color: gold;
}

    
/* Card styles */

.card-front.BarabarCaves {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("BarabarCaves.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.Bodhgaya {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("Bodhgaya.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.Nalanda {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("Nalanda.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.Patna {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("Patna.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.Rajgir {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("Rajgir.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}



</style>
</head>

<body>
<body>
  <div class="right-section">
<div class="right-title">Top Spots</div>

<div class="container">

  <div class="card">
    <div class="card-inner">
      <div class="card-front BarabarCaves">
        <div class="star" data-id="BarabarCaves">&#9734;</div>
        Barabar Caves
      </div>
      <div class="card-back">
        <div class="star" data-id="BarabarCaves">&#9734;</div>
        <a href="BarabarCaves.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front Bodhgaya">
        <div class="star" data-id="Bodhgaya">&#9734;</div>
        Bodhgaya
      </div>
      <div class="card-back">
        <div class="star" data-id="Bodhgaya">&#9734;</div>
        <a href="Bodhgaya.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front Nalanda">
        <div class="star" data-id="Nalanda">&#9734;</div>
        Nalanda
      </div>
      <div class="card-back">
        <div class="star" data-id="Nalanda">&#9734;</div>
        <a href="Nalanda.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front Patna">
        <div class="star" data-id="Patna">&#9734;</div>
        Patna
      </div>
      <div class="card-back">
        <div class="star" data-id="Patna">&#9734;</div>
        <a href="Patna.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front Rajgir">
        <div class="star" data-id="Rajgir">&#9734;</div>
        Rajgir
      </div>
      <div class="card-back">
        <div class="star" data-id="Rajgir">&#9734;</div>
        <a href="Rajgir.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

</div>
</div>
<script>
// ===== USER & KEY =====
const currentUser = localStorage.getItem("currentUser");
const key = currentUser ? "myStars_" + currentUser : null;

// ===== LOAD SAVED =====
let saved = key ? JSON.parse(localStorage.getItem(key)) || [] : [];

// ===== INIT ALL STARS =====
const stars = document.querySelectorAll(".star");

stars.forEach(star => {
  const id = star.getAttribute("data-id");

  // initial fill
  if (saved.includes(id)) {
    star.textContent = "★";
    star.classList.add("active");
  } else {
    star.textContent = "☆";
    star.classList.remove("active");
  }

  // click
  star.addEventListener("click", (e) => {
    e.stopPropagation();

    if (!key) {
      alert("Please login first");
      return;
    }

    const isActive = saved.includes(id);

    if (isActive) {
      saved = saved.filter(x => x !== id);
    } else {
      saved.push(id);
    }

    // update all matching stars (front/back)
    document.querySelectorAll(`.star[data-id="${id}"]`).forEach(s => {
      if (isActive) {
        s.textContent = "☆";
        s.classList.remove("active");
      } else {
        s.textContent = "★";
        s.classList.add("active");
      }
    });

    // save per user
    localStorage.setItem(key, JSON.stringify(saved));
  });
});
</script>
</body>
</html>
