<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assam Tourist Cards</title>
<link rel="stylesheet" href="../../ScrollBar.css">
<link rel="stylesheet" href="../../RightStyle.css">
<link rel="stylesheet" href="../../CardStyle.css">

<style>

/* ⭐ STAR */
.star {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
    color: white;
    transition: 0.3s;
}

.card-back .star {
    color: black;
}

.star.active {
    color: gold;
}

 
/* Card styles */

.card-front.KamkhyaTemple {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("KamkhyaTemple.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.Kaziranga {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("Kaziranga.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.MajuliIsland {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("MajuliIsland.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.ManasNationalPark {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("ManasNationalPark.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

.card-front.Sivasagr {
    background: 
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("Sivasagr.jpg");

    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
}

</style>
</head>

<body>
<body>
  <div class="right-section">
<div class="right-title">Top Spots</div>

<div class="container">

  <div class="card">
    <div class="card-inner">
      <div class="card-front KamkhyaTemple">
        <div class="star" data-id="KamkhyaTemple">&#9734;</div>
        Kamkhya Temple
      </div>
      <div class="card-back">
        <div class="star" data-id="KamkhyaTemple">&#9734;</div>
        <a href="KamkhyaTemple.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front Kaziranga">
        <div class="star" data-id="Kaziranga">&#9734;</div>
        Kaziranga
      </div>
      <div class="card-back">
        <div class="star" data-id="Kaziranga">&#9734;</div>
        <a href="Kaziranga.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front MajuliIsland">
        <div class="star" data-id="MajuliIsland">&#9734;</div>
        Majuli Island
      </div>
      <div class="card-back">
        <div class="star" data-id="MajuliIsland">&#9734;</div>
        <a href="MajuliIsland.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front ManasNationalPark">
        <div class="star" data-id="ManasNationalPark">&#9734;</div>
        Manas National Park
      </div>
      <div class="card-back">
        <div class="star" data-id="ManasNationalPark">&#9734;</div>
        <a href="ManasNationalPark.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-inner">
      <div class="card-front Sivasagr">
        <div class="star" data-id="Sivasagr">&#9734;</div>
        Sivasagr
      </div>
      <div class="card-back">
        <div class="star" data-id="Sivasagr">&#9734;</div>
        <a href="Sivasagr.html" target="content_frame">View Info</a>
      </div>
    </div>
  </div>

</div>
</div>
<script>
// ===== USER & KEY =====
const currentUser = localStorage.getItem("currentUser");
const key = currentUser ? "myStars_" + currentUser : null;

// ===== LOAD SAVED =====
let saved = key ? JSON.parse(localStorage.getItem(key)) || [] : [];

// ===== INIT ALL STARS =====
const stars = document.querySelectorAll(".star");

stars.forEach(star => {
  const id = star.getAttribute("data-id");

  // initial fill
  if (saved.includes(id)) {
    star.textContent = "★";
    star.classList.add("active");
  } else {
    star.textContent = "☆";
    star.classList.remove("active");
  }

  // click
  star.addEventListener("click", (e) => {
    e.stopPropagation();

    if (!key) {
      alert("Please login first");
      return;
    }

    const isActive = saved.includes(id);

    if (isActive) {
      saved = saved.filter(x => x !== id);
    } else {
      saved.push(id);
    }

    // update all matching stars (front/back)
    document.querySelectorAll(`.star[data-id="${id}"]`).forEach(s => {
      if (isActive) {
        s.textContent = "☆";
        s.classList.remove("active");
      } else {
        s.textContent = "★";
        s.classList.add("active");
      }
    });

    // save per user
    localStorage.setItem(key, JSON.stringify(saved));
  });
});
</script>
</body>
</html>
